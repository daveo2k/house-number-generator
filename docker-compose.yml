services:
  house-number-generator:
    build:
      context: .
      dockerfile: Dockerfile
    # Built from this repo, never pulled from a registry
    pull_policy: build
    # Different name and port from main, so both versions can run side by side
    container_name: ${CONTAINER_NAME:-house-number-generator-removable}
    ports:
      - "${HTTP_PORT:-8081}:8080"
    restart: unless-stopped
